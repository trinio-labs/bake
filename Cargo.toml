[package]
name = "bake-cli"
version = "2.3.0"
edition = "2024"
authors = ["Theo Ribeiro <repitilian.intern@proton.me>"]
license = "Apache-2.0"
description = "Task runner built to be tastier than `make`"
homepage = "https://github.com/trinio-labs/bake"
repository = "https://github.com/trinio-labs/bake"
readme = "README.md"
categories = ["command-line-utilities", "development-tools::build-utils"]
keywords = ["bake", "task-runner", "make", "build-tool"]
rust-version = "1.93.0"

[lib]
name = "bake"
path = "src/lib.rs"

[[bin]]
name = "bake"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true

[dependencies]
anyhow = "1.0.105"
async-trait = "0.1.92"
aws-config = "1.8.18"
aws-sdk-s3 = "1.137.0"
blake3 = "1.8.7"
bytes = "1.12.2"
clap = { version = "4.6.10", features = ["derive"] }
clap_complete = "4.6"
console = "0.16.6"
dirs = "7.0.0"
env_logger = "0.11.12"
futures-core = "0.3.34"
futures-util = "0.3.34"
globset = "0.4.22"
google-cloud-storage = "1.22.0"
handlebars = "6.4.4"
hex = "0.4.3"
hostname = "0.4.2"
ignore = "0.4.35"
indexmap = { version = "2.14.2", features = ["serde"] }
indicatif = "0.18.6"
libc = "0.2"
log = "0.4.35"
num_cpus = "1.17.0"
pathdiff = "0.2.3"
petgraph = "0.8.3"
rayon = "1.12"
rand = "0.10.4"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
validator = { version = "0.21.0", features = ["derive"] }
zstd = { version = "0.14.5", features = ["zstdmt"] }
hmac = "0.13"

[dev-dependencies]
tempfile = "3.27.0"
test-case = "3.4.1"
mockall = "0.15.0"
tokio-test = "0.4.6"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
